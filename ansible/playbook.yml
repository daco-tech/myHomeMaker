#!/usr/bin/env ansible-playbook
- hosts: localhost
  connection: local
  tasks:
    - debug:
        msg: Check we are running in the directory of the script
      failed_when: not ansible_env.PWD.endswith('/ansible')

- hosts: localhost
  strategy: free
  become_method: sudo
  connection: local
  gather_facts: True
  vars:
    install_all_package_updates: true
    # Homebrew Bundle file (repo root) - the single source of truth for CLI
    # tools installed on both macOS and Linux, plus macOS-only GUI apps/fonts
    # (Homebrew casks). Applied by the crossplatform-package-manager role via
    # `brew bundle`. See ../Brewfile.
    brewfile_path: "{{ playbook_dir }}/../Brewfile"
    repo_brew_tap: []
    rpm_keys:
      - https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/raw/master/pub.gpg
    rpm_repo:
      - name: codium
        description: Codium Repo
        url: https://download.vscodium.com/rpms/
        gpg: yes
        file: vscodium.repo
    # The lists below are now limited to packages with no Homebrew
    # equivalent (GUI apps, system fonts, kernel/systemd-adjacent tools) -
    # everything else moved to the Brewfile.
    install_arch_linux_aur_packages:
      - vscodium-bin
      - timeshift-bin
      - stacer
      #- ttf-firacode
      - powerline-fonts
      - nerd-fonts-hack
      - vlc-luajit
      - podman-docker
    install_debian_linux_packages:
      #- codium
      - fonts-firacode
      - fonts-powerline
      - build-essential
      - module-assistant
      - vlc
      - nala
      - podman-docker
    install_linux_packages:
      - timeshift
      - stacer
      - zsh
      - powertop
      - net-tools
      - pydf
      #- virtualbox
      - flameshot #screenshot tool
      #- vagrant
    install_mac_packages: []
    install_mac_cask_packages: []
    install_go_linux_packages: []
    install_packages: []
  roles:
    - mactweaks
    - kubectx
    - kubectl
    - nanorc
    #- fingerprintd
    #- packer
    #- terraform
    - awscli
    - powerline-fonts
    - crossplatform-package-manager
    - podman
    #- dep
    - nerdfonts
    #- docker
    - role: oh-my-zsh
      users:
        - username: "{{ ansible_user_id | default('daco') }}"
          oh_my_zsh:
            theme: robbyrussell
            plugins:
              - git
    #- role: joplinapp-linux
    #  users:
    #  - username: "{{ ansible_user_id }}"
    #    settings:
    #      - { key: "sidebarVisibility", val: "1" }
    #      - { key: "dateFormat", val: "YYYY-MM-DD" }
    #      - { key: "sync.target", val: "5" }
    #- role: tmux
    #  vars:
    #    ctrlkey: "C-"
    #    splitv: "\\\\"
    #    splith: "-"
    #    city: "Ermesinde"
    #  when:
    #    - ansible_system == "Linux"
    - role: tmux
      vars:
        ctrlkey: "^"
        splitv: "\\\\"
        splith: "-"
        city: "Porto"
      when:
        - ansible_system == "Darwin"
    - role: ghostty
      when:
        - ansible_system == "Darwin"
    - role: vscodium
      vars:
        terminal_font: "Hack"
      users:
        - username: "{{ ansible_user_id | default('daco') }}"
          #visual_studio_code_extensions:
          visual_studio_code_settings_overwrite: yes
      when:
        - ansible_system == "Linux"
    - role: vscodium
      vars:
        terminal_font: "Hack Nerd Fonts"
        visual_studio_code_flavor: vscode
      users:
        - username: "{{ ansible_user_id }}"
          #visual_studio_code_extensions:
          visual_studio_code_settings_overwrite: yes
      when:
        - ansible_system == "Darwin"
