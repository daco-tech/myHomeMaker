---
# for software package updates
install_all_package_updates: true

# Homebrew Bundle file (see repo root Brewfile) applied via `brew bundle` -
# the single source of truth for CLI tools installed on both macOS and
# Linux, plus macOS-only GUI apps/fonts (Homebrew casks).
brewfile_path: "{{ playbook_dir }}/../Brewfile"

# list of packages to install
install_packages: []

# list of packages to remove
remove_linux_packages: []
remove_mac_packages: []

# list of packages to update
update_packages: []

# list of linux only install
install_linux_packages: []

install_go_linux_packages: []

# list of mac only install
install_mac_packages: []
install_mac_cask_packages: []


# list of repository additions
repo_brew_tap: []

# list of rpm keys
rpm_keys: []

# list of rpm repos
rpm_repo: []

